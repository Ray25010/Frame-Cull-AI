<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameCull AI Flash</title>
    <style>
      @keyframes fly-out-right {
        0% { transform: translateX(0) rotate(0); opacity: 1; }
        100% { transform: translateX(500px) rotate(15deg); opacity: 0; }
      }
      @keyframes fly-out-left {
        0% { transform: translateX(0) rotate(0); opacity: 1; }
        100% { transform: translateX(-500px) rotate(-15deg); opacity: 0; }
      }
      .animate-pick { animation: fly-out-right 0.5s ease-out forwards; }
      .animate-reject { animation: fly-out-left 0.5s ease-out forwards; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      html,
      body,
      #root {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        background: #101115;
      }
      body {
        overflow: hidden;
        color: rgba(244, 244, 245, 0.96);
      }

      #app-loading {
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        z-index: 9999;
        color: rgba(244, 244, 245, 0.96);
        background:
          radial-gradient(circle at 50% 48%, rgba(73, 88, 112, 0.18), transparent 34%),
          linear-gradient(135deg, #18191d 0%, #101115 58%, #15161a 100%);
        transition: opacity 0.46s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-workspace {
        position: absolute;
        inset: 14px;
        pointer-events: none;
      }
      .loading-workspace::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.035);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), rgba(255, 255, 255, 0));
      }
      .loading-topbar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 48px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.045);
        background: rgba(23, 25, 29, 0.72);
        backdrop-filter: blur(42px) saturate(140%);
      }
      .loading-rail,
      .loading-inspector {
        position: absolute;
        top: 48px;
        bottom: 0;
        border-color: rgba(255, 255, 255, 0.04);
        background: rgba(255, 255, 255, 0.018);
      }
      .loading-rail {
        left: 0;
        width: 176px;
        border-right: 1px solid rgba(255, 255, 255, 0.04);
      }
      .loading-inspector {
        right: 0;
        width: 268px;
        border-left: 1px solid rgba(255, 255, 255, 0.04);
      }
      .loading-thumb,
      .loading-line {
        position: absolute;
        left: 18px;
        right: 18px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
      }
      .loading-thumb { height: 64px; }
      .loading-thumb:nth-child(1) { top: 28px; }
      .loading-thumb:nth-child(2) { top: 106px; opacity: 0.7; }
      .loading-thumb:nth-child(3) { top: 184px; opacity: 0.45; }
      .loading-line { height: 28px; }
      .loading-line:nth-child(1) { top: 30px; }
      .loading-line:nth-child(2) { top: 72px; opacity: 0.76; }
      .loading-line:nth-child(3) { top: 114px; opacity: 0.52; }
      .loading-line:nth-child(4) { top: 156px; opacity: 0.34; }
      .loading-viewer-frame {
        position: absolute;
        left: 208px;
        right: 300px;
        top: 104px;
        bottom: 84px;
        border: 1px solid rgba(255, 255, 255, 0.028);
        border-radius: 28px;
      }
      .loading-console {
        position: relative;
        width: min(560px, calc(100vw - 44px));
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.055);
        border-radius: 18px;
        background: rgba(27, 29, 33, 0.76);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.052),
          0 24px 60px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(76px) saturate(150%);
      }
      .loading-console::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: rgba(255, 255, 255, 0.11);
      }
      .loading-console-inner {
        position: relative;
        padding: 22px;
      }
      .loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .loading-mark {
        position: relative;
        width: 42px;
        height: 42px;
        overflow: hidden;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .loading-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .loading-mark::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-120%);
        background: linear-gradient(90deg, transparent, rgba(126, 214, 255, 0.28), transparent);
        animation: loading-sweep 1.9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .loading-title {
        margin: 0;
        font: 650 15px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0;
      }
      .loading-subtitle {
        margin-top: 3px;
        color: rgba(161, 168, 179, 0.82);
        font: 500 12px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      .loading-status {
        margin-top: 20px;
      }
      .loading-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: rgba(212, 216, 224, 0.88);
        font: 500 12px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      .loading-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: rgba(186, 230, 253, 0.96);
      }
      .loading-pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #7dd3fc;
        box-shadow: 0 0 14px rgba(125, 211, 252, 0.58);
      }
      .loading-statusline {
        position: relative;
        height: 2px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.34);
      }
      .loading-statusline::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(56, 189, 248, 0.24), rgba(125, 211, 252, 0.92), rgba(251, 191, 36, 0.68));
        animation: loading-progress 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .loading-scan-grid {
        position: absolute;
        inset: auto 18px 18px 18px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        opacity: 0.38;
      }
      .loading-scan-grid span {
        height: 12px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
      }
      .loading-scan-grid span:nth-child(2),
      .loading-scan-grid span:nth-child(6) {
        background: rgba(125, 211, 252, 0.22);
      }
      @keyframes loading-sweep {
        0% { transform: translateX(-120%); opacity: 0; }
        22% { opacity: 1; }
        100% { transform: translateX(120%); opacity: 0; }
      }
      @keyframes loading-progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(230%); }
      }
      @media (max-width: 920px) {
        .loading-rail,
        .loading-inspector {
          display: none;
        }
        .loading-viewer-frame {
          left: 28px;
          right: 28px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-mark::after,
        .loading-statusline::before {
          animation: none;
        }
        .loading-statusline::before {
          transform: none;
          width: 62%;
        }
      }

      .brand-boot {
        position: relative;
        display: grid;
        place-items: center;
        width: min(420px, calc(100vw - 44px));
        min-height: 300px;
      }
      .brand-boot-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .brand-mark-stage {
        position: relative;
        width: 148px;
        height: 148px;
        display: grid;
        place-items: center;
      }
      .brand-mark-stage::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.12), transparent 68%);
        filter: blur(14px);
        animation: brand-glow 2.8s ease-in-out infinite;
      }
      .brand-mark-frame {
        position: relative;
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
        overflow: visible;
        background: transparent;
        transform: translateX(-8px);
      }
      .brand-mark-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        filter:
          saturate(1.08)
          contrast(1.05)
          drop-shadow(0 0 13px rgba(56, 189, 248, 0.34))
          drop-shadow(0 0 30px rgba(56, 189, 248, 0.13))
          drop-shadow(0 0 13px rgba(251, 191, 36, 0.14));
      }
      .brand-mark-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.58;
        background:
          linear-gradient(
            90deg,
            transparent 0%,
            transparent 34%,
            rgba(125, 211, 252, 0.00) 42%,
            rgba(186, 230, 253, 0.70) 48%,
            rgba(125, 211, 252, 0.95) 50%,
            rgba(251, 191, 36, 0.26) 53%,
            rgba(125, 211, 252, 0.00) 62%,
            transparent 100%
          );
        background-size: 185% 100%;
        background-position: -95% 50%;
        filter: drop-shadow(0 0 8px rgba(125, 211, 252, 0.62));
        animation: brand-scan 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        mix-blend-mode: screen;
        -webkit-mask-image: url("/src/assets/brand/framecull-mark.png");
        mask-image: url("/src/assets/brand/framecull-mark.png");
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
      }
      .brand-mark-frame::after {
        content: "";
        position: absolute;
        top: -4px;
        bottom: -4px;
        left: 0;
        width: 2px;
        border-radius: 999px;
        opacity: 0;
        background: linear-gradient(180deg, transparent, rgba(186, 230, 253, 0.98) 26%, rgba(125, 211, 252, 0.96) 50%, rgba(251, 191, 36, 0.55) 72%, transparent);
        box-shadow:
          0 0 12px rgba(125, 211, 252, 0.72),
          0 0 24px rgba(125, 211, 252, 0.30);
        transform: translateX(8px);
        animation: brand-scan-line 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        mix-blend-mode: screen;
      }
      .brand-boot-title {
        margin: 0;
        width: 100%;
        text-align: center;
        font: 700 22px/1.1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0;
      }
      .brand-boot-copy {
        width: min(320px, calc(100vw - 80px));
        text-align: center;
      }
      .brand-boot-subtitle {
        margin-top: 7px;
        width: 100%;
        text-align: center;
        color: rgba(161, 168, 179, 0.86);
        font: 500 12px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      .brand-boot-status {
        width: min(260px, calc(100vw - 80px));
        height: 2px;
        margin-top: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.36);
      }
      .brand-boot-status::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(56, 189, 248, 0.20), rgba(125, 211, 252, 0.96), rgba(251, 191, 36, 0.58));
        animation: loading-progress 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .brand-boot-signature {
        margin-top: 10px;
        color: rgba(161, 168, 179, 0.62);
        font: 600 11px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0;
      }
      @keyframes brand-scan {
        0% { background-position: -95% 50%; opacity: 0; }
        12% { opacity: 0.86; }
        72% { opacity: 0.86; }
        100% { background-position: 195% 50%; opacity: 0; }
      }
      @keyframes brand-scan-line {
        0% { transform: translateX(8px); opacity: 0; }
        10% { opacity: 0.88; }
        78% { opacity: 0.88; }
        100% { transform: translateX(122px); opacity: 0; }
      }
      @keyframes brand-glow {
        0%, 100% { opacity: 0.72; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-mark-stage::before,
        .brand-mark-frame::before,
        .brand-mark-frame::after,
        .brand-boot-status::before {
          animation: none;
        }
        .brand-mark-frame::before,
        .brand-mark-frame::after {
          opacity: 0;
        }
        .brand-boot-status::before {
          transform: none;
          width: 68%;
        }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen overflow-hidden">
    <div id="app-loading" role="status" aria-live="polite">
      <div class="brand-boot" aria-hidden="true">
        <div class="brand-boot-shell">
          <div class="brand-mark-stage">
            <div class="brand-mark-frame">
              <img src="/src/assets/brand/framecull-mark.png" alt="" />
            </div>
          </div>
          <div class="brand-boot-copy">
            <p class="brand-boot-title">FrameCull AI Flash v0.1.6</p>
            <div class="brand-boot-subtitle">Opening local photo workspace</div>
          </div>
          <div class="brand-boot-status"></div>
          <div class="brand-boot-signature">Produce BY Ray_Frame ©2026</div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
