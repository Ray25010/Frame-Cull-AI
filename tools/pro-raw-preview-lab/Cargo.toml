[package]
name = "framecull-pro-raw-preview-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.5"
rawler = "0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
